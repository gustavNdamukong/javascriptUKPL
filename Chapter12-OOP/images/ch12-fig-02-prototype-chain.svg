<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" width="720" height="260" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
    </marker>
  </defs>
  <rect width="720" height="260" fill="#ffffff"/>
  <text x="360" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#111">The prototype chain: a single line of links</text>

  <rect x="20" y="70" width="150" height="66" rx="6" fill="#ffffff" stroke="#111" stroke-width="2"/>
  <text x="95" y="98" text-anchor="middle" font-size="14" font-family="Courier, monospace" fill="#111">person1</text>
  <text x="95" y="120" text-anchor="middle" font-size="11" fill="#444">your object</text>

  <rect x="212" y="70" width="176" height="66" rx="6" fill="#eeeeee" stroke="#111" stroke-width="2"/>
  <text x="300" y="98" text-anchor="middle" font-size="13.5" font-family="Courier, monospace" fill="#111">Person.prototype</text>
  <text x="300" y="120" text-anchor="middle" font-size="11" fill="#444">methods you added</text>

  <rect x="430" y="70" width="176" height="66" rx="6" fill="#eeeeee" stroke="#111" stroke-width="2"/>
  <text x="518" y="98" text-anchor="middle" font-size="13.5" font-family="Courier, monospace" fill="#111">Object.prototype</text>
  <text x="518" y="120" text-anchor="middle" font-size="11" fill="#444">toString, hasOwnProperty</text>

  <rect x="648" y="82" width="56" height="42" rx="6" fill="#ffffff" stroke="#111" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="676" y="108" text-anchor="middle" font-size="14" font-family="Courier, monospace" fill="#111">null</text>

  <line x1="172" y1="103" x2="206" y2="103" stroke="#222" stroke-width="2" marker-end="url(#b)"/>
  <line x1="390" y1="103" x2="424" y2="103" stroke="#222" stroke-width="2" marker-end="url(#b)"/>
  <line x1="608" y1="103" x2="642" y2="103" stroke="#222" stroke-width="2" marker-end="url(#b)"/>
  <text x="676" y="140" text-anchor="middle" font-size="11" fill="#444">end of the chain</text>

  <text x="360" y="182" text-anchor="middle" font-size="12.5" fill="#333">Ask for a property and JavaScript walks left to right until it finds it, or reaches null.</text>
  <text x="360" y="214" text-anchor="middle" font-size="12.5" fill="#333">Each object has exactly ONE prototype — never two. Both boxes above are in</text>
  <text x="360" y="232" text-anchor="middle" font-size="12.5" fill="#333">person1's chain, but only Person.prototype is its prototype.</text>
</svg>
