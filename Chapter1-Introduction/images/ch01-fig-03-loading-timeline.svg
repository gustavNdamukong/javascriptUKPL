<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" font-family="Helvetica, Arial, sans-serif">
  <rect width="900" height="330" fill="#ffffff"/>

  <text x="40" y="26" font-size="17" font-weight="bold" fill="#1c2b3a">What happens, and in what order, as a page loads</text>

  <!-- phase bars -->
  <rect x="60" y="86" width="300" height="34" rx="5" fill="#3d5266"/>
  <text x="210" y="108" font-size="13" fill="#ffffff" text-anchor="middle">browser reads the HTML</text>

  <rect x="370" y="86" width="330" height="34" rx="5" fill="#c9d3dc"/>
  <text x="535" y="108" font-size="13" fill="#1c2b3a" text-anchor="middle">images, stylesheets and fonts download</text>

  <!-- the timeline itself -->
  <path d="M60 160 H840" stroke="#1c2b3a" stroke-width="2"/>
  <path d="M832 154 L844 160 L832 166 z" fill="#1c2b3a"/>
  <text x="846" y="182" font-size="12" fill="#6b7a89">time</text>

  <!-- marker 1 : DOMContentLoaded -->
  <circle cx="365" cy="160" r="8" fill="#e8871a"/>
  <path d="M365 160 V206" stroke="#e8871a" stroke-width="2" stroke-dasharray="5 4"/>
  <rect x="248" y="206" width="234" height="56" rx="6" fill="#fdeee0" stroke="#e8871a" stroke-width="1.5"/>
  <text x="365" y="228" font-size="14" font-weight="bold" fill="#b8640a" text-anchor="middle">DOMContentLoaded fires</text>
  <text x="365" y="249" font-size="12" fill="#6b7a89" text-anchor="middle">every element now exists</text>

  <!-- marker 2 : load -->
  <circle cx="705" cy="160" r="8" fill="#2f7d4f"/>
  <path d="M705 160 V206" stroke="#2f7d4f" stroke-width="2" stroke-dasharray="5 4"/>
  <rect x="600" y="206" width="210" height="56" rx="6" fill="#e6f2ea" stroke="#2f7d4f" stroke-width="1.5"/>
  <text x="705" y="228" font-size="14" font-weight="bold" fill="#1f5c39" text-anchor="middle">load fires</text>
  <text x="705" y="249" font-size="12" fill="#6b7a89" text-anchor="middle">the pictures have arrived too</text>

  <!-- defer marker, sitting just before DOMContentLoaded -->
  <path d="M320 160 V118" stroke="#1c2b3a" stroke-width="2" stroke-dasharray="5 4"/>
  <circle cx="320" cy="160" r="6" fill="#1c2b3a"/>
  <rect x="196" y="42" width="248" height="34" rx="5" fill="#ffffff" stroke="#1c2b3a" stroke-width="1.5"/>
  <text x="320" y="64" font-size="13" fill="#1c2b3a" text-anchor="middle">a defer script runs about here</text>
  <path d="M320 76 V116" stroke="#1c2b3a" stroke-width="1.5" stroke-dasharray="4 4"/>

  <text x="60" y="300" font-size="13" fill="#6b7a89">DOMContentLoaded does not wait for images. If you need to wait for those as well, use load instead.</text>
</svg>
