<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" font-family="Helvetica, Arial, sans-serif">
  <rect width="900" height="470" fill="#ffffff"/>

  <text x="34" y="30" font-size="17" font-weight="bold" fill="#1c2b3a">Reaching for a variable before you declare it</text>

  <!-- shared top band -->
  <rect x="34" y="46" width="832" height="38" rx="6" fill="#eef2f5" stroke="#c9d3dc" stroke-width="1.2"/>
  <text x="450" y="70" font-size="13" fill="#3d5266" text-anchor="middle">Before a single line runs, JavaScript has already noted every declaration in the scope. This is hoisting.</text>

  <!-- ===================== var column ===================== -->
  <text x="34" y="114" font-size="15" font-weight="bold" fill="#b8640a">with var</text>

  <rect x="34" y="126" width="396" height="240" rx="8" fill="#ffffff" stroke="#c9d3dc" stroke-width="1.5"/>

  <!-- shaded region -->
  <rect x="46" y="140" width="372" height="86" rx="5" fill="#fdeee0"/>
  <text x="60" y="164" font-size="12.5" font-weight="bold" fill="#b8640a">price already exists here,</text>
  <text x="60" y="182" font-size="12.5" font-weight="bold" fill="#b8640a">holding undefined</text>

  <rect x="60" y="192" width="344" height="26" rx="4" fill="#ffffff" stroke="#e8871a" stroke-width="1.2"/>
  <text x="72" y="210" font-size="13" fill="#1c2b3a" font-family="Menlo, Consolas, monospace">console.log(price);</text>

  <path d="M60 240 H404" stroke="#e8871a" stroke-width="2"/>
  <text x="60" y="262" font-size="13" fill="#1c2b3a" font-family="Menlo, Consolas, monospace">var price = 100;</text>

  <text x="60" y="300" font-size="12.5" fill="#6b7a89">That console.log prints:</text>
  <rect x="60" y="310" width="150" height="30" rx="5" fill="#3d5266"/>
  <text x="135" y="330" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle" font-family="Menlo, Consolas, monospace">undefined</text>
  <text x="222" y="330" font-size="12.5" fill="#6b7a89">no error at all</text>

  <!-- ===================== let column ===================== -->
  <text x="470" y="114" font-size="15" font-weight="bold" fill="#1f5c39">with let</text>

  <rect x="470" y="126" width="396" height="240" rx="8" fill="#ffffff" stroke="#c9d3dc" stroke-width="1.5"/>

  <!-- TDZ region, hatched -->
  <defs>
    <pattern id="tdz" width="9" height="9" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="9" height="9" fill="#f4e6e4"/>
      <line x1="0" y1="0" x2="0" y2="9" stroke="#d9a49e" stroke-width="3"/>
    </pattern>
  </defs>
  <rect x="482" y="140" width="372" height="86" rx="5" fill="url(#tdz)"/>
  <text x="496" y="164" font-size="12.5" font-weight="bold" fill="#a03127">temporal dead zone</text>
  <text x="496" y="182" font-size="12" fill="#7a4a45">total exists, but cannot be touched</text>

  <rect x="496" y="192" width="344" height="26" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="1.2"/>
  <text x="508" y="210" font-size="13" fill="#1c2b3a" font-family="Menlo, Consolas, monospace">console.log(total);</text>

  <path d="M496 240 H840" stroke="#2f7d4f" stroke-width="2"/>
  <text x="496" y="262" font-size="13" fill="#1c2b3a" font-family="Menlo, Consolas, monospace">let total = 100;</text>

  <text x="496" y="300" font-size="12.5" fill="#6b7a89">That console.log throws:</text>
  <rect x="496" y="310" width="344" height="30" rx="5" fill="#c0392b"/>
  <text x="668" y="330" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle" font-family="Menlo, Consolas, monospace">ReferenceError: Cannot access 'total'</text>

  <!-- shared bottom note -->
  <rect x="34" y="386" width="832" height="56" rx="8" fill="#e6f2ea" stroke="#2f7d4f" stroke-width="1.5"/>
  <text x="52" y="410" font-size="13" font-weight="bold" fill="#1f5c39">The error is the better outcome.</text>
  <text x="52" y="430" font-size="12.5" fill="#3d5266">var lets the mistake slide past quietly. let stops and tells you exactly what went wrong, which is far easier to fix.</text>
</svg>
