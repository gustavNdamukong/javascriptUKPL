<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" font-family="Helvetica, Arial, sans-serif">
  <rect width="900" height="500" fill="#ffffff"/>

  <text x="34" y="30" font-size="17" font-weight="bold" fill="#1c2b3a">How far each kind of variable can be seen</text>

  <!-- ============ global scope ============ -->
  <rect x="34" y="52" width="832" height="404" rx="10" fill="#ffffff" stroke="#1c2b3a" stroke-width="2"/>
  <text x="52" y="76" font-size="13" font-weight="bold" fill="#1c2b3a">Global (script) scope</text>

  <rect x="52" y="88" width="196" height="30" rx="5" fill="#eef2f5" stroke="#c9d3dc" stroke-width="1.2"/>
  <text x="66" y="108" font-size="13" fill="#1c2b3a" font-family="Menlo, Consolas, monospace">let total = 1;</text>

  <!-- ============ function scope ============ -->
  <rect x="52" y="134" width="796" height="304" rx="9" fill="#ffffff" stroke="#3d5266" stroke-width="2" stroke-dasharray="0"/>
  <text x="70" y="158" font-size="13" font-weight="bold" fill="#3d5266" font-family="Menlo, Consolas, monospace">function example() {</text>

  <rect x="70" y="170" width="210" height="30" rx="5" fill="#eef2f5" stroke="#c9d3dc" stroke-width="1.2"/>
  <text x="84" y="190" font-size="13" fill="#1c2b3a" font-family="Menlo, Consolas, monospace">var count = 2;</text>

  <!-- ============ block scope ============ -->
  <rect x="70" y="218" width="420" height="192" rx="8" fill="#fbfcfd" stroke="#e8871a" stroke-width="2"/>
  <text x="88" y="242" font-size="13" font-weight="bold" fill="#b8640a" font-family="Menlo, Consolas, monospace">if (true) {</text>

  <rect x="88" y="254" width="200" height="28" rx="5" fill="#eef2f5" stroke="#c9d3dc" stroke-width="1.2"/>
  <text x="100" y="273" font-size="13" fill="#1c2b3a" font-family="Menlo, Consolas, monospace">let x = 3;</text>

  <rect x="88" y="290" width="200" height="28" rx="5" fill="#eef2f5" stroke="#c9d3dc" stroke-width="1.2"/>
  <text x="100" y="309" font-size="13" fill="#1c2b3a" font-family="Menlo, Consolas, monospace">const y = 4;</text>

  <rect x="88" y="332" width="200" height="28" rx="5" fill="#fdeee0" stroke="#e8871a" stroke-width="1.4"/>
  <text x="100" y="351" font-size="13" fill="#b8640a" font-family="Menlo, Consolas, monospace">var z = 5;</text>

  <text x="88" y="392" font-size="13" font-weight="bold" fill="#b8640a" font-family="Menlo, Consolas, monospace">}</text>

  <!-- let / const blocked at the block wall -->
  <path d="M292 268 H470" stroke="#3d5266" stroke-width="2"/>
  <path d="M292 304 H470" stroke="#3d5266" stroke-width="2"/>
  <path d="M478 254 V318" stroke="#c0392b" stroke-width="3" stroke-linecap="round"/>
  <path d="M470 275 l14 14 M484 275 l-14 14" stroke="#c0392b" stroke-width="2.6" stroke-linecap="round"/>
  <text x="500" y="272" font-size="12.5" font-weight="bold" fill="#c0392b">let and const stop</text>
  <text x="500" y="290" font-size="12.5" font-weight="bold" fill="#c0392b">at the block wall</text>
  <text x="500" y="310" font-size="12" fill="#6b7a89">outside here they are</text>
  <text x="500" y="326" font-size="12" fill="#6b7a89">simply not defined</text>

  <!-- var passes through the block wall, stops at the function wall -->
  <path d="M292 346 H838" stroke="#e8871a" stroke-width="2.5" stroke-dasharray="8 5"/>
  <circle cx="490" cy="346" r="5" fill="#ffffff" stroke="#e8871a" stroke-width="2"/>
  <text x="504" y="368" font-size="12" fill="#b8640a">var passes straight through the block wall...</text>
  <path d="M848 322 V374" stroke="#c0392b" stroke-width="3" stroke-linecap="round"/>
  <path d="M840 342 l16 16 M856 342 l-16 16" stroke="#c0392b" stroke-width="2.6" stroke-linecap="round"/>
  <text x="820" y="392" font-size="12.5" font-weight="bold" fill="#c0392b" text-anchor="end">...and is stopped only by the function wall</text>

  <text x="70" y="428" font-size="13" font-weight="bold" fill="#3d5266" font-family="Menlo, Consolas, monospace">}</text>

  <text x="34" y="482" font-size="12.5" fill="#6b7a89">let and const are held by every set of curly braces. var ignores them all, and is stopped only by a function.</text>
</svg>
