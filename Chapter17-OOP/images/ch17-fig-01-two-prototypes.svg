<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 372" width="760" height="372" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
    </marker>
  </defs>
  <rect width="760" height="372" fill="#ffffff"/>
  <text x="380" y="32" text-anchor="middle" font-size="17" font-weight="bold" fill="#111">Two different things are called "prototype"</text>

  <rect x="20" y="86" width="196" height="96" rx="6" fill="#ffffff" stroke="#111" stroke-width="2"/>
  <text x="118" y="112" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#111">the FUNCTION</text>
  <text x="118" y="137" text-anchor="middle" font-size="15" font-family="Courier, monospace" fill="#111">Person</text>
  <text x="118" y="162" text-anchor="middle" font-size="11.5" fill="#444">only functions have this</text>

  <rect x="330" y="86" width="200" height="96" rx="6" fill="#eeeeee" stroke="#111" stroke-width="2"/>
  <text x="430" y="112" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#111">the MOULD</text>
  <text x="430" y="137" text-anchor="middle" font-size="14" font-family="Courier, monospace" fill="#111">Person.prototype</text>
  <text x="430" y="162" text-anchor="middle" font-size="11.5" fill="#444">shared by every instance</text>

  <rect x="330" y="256" width="200" height="80" rx="6" fill="#ffffff" stroke="#111" stroke-width="2"/>
  <text x="430" y="282" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#111">the OBJECT</text>
  <text x="430" y="306" text-anchor="middle" font-size="15" font-family="Courier, monospace" fill="#111">person1</text>
  <text x="430" y="326" text-anchor="middle" font-size="11.5" fill="#444">made with new Person()</text>

  <line x1="218" y1="134" x2="324" y2="134" stroke="#222" stroke-width="2" marker-end="url(#a)"/>
  <text x="271" y="122" text-anchor="middle" font-size="12" font-family="Courier, monospace" fill="#111">.prototype</text>

  <line x1="430" y1="250" x2="430" y2="188" stroke="#222" stroke-width="2" marker-end="url(#a)"/>
  <text x="442" y="222" font-size="12" font-family="Courier, monospace" fill="#111">__proto__</text>

  <rect x="566" y="176" width="176" height="76" rx="6" fill="#ffffff" stroke="#777" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="654" y="202" text-anchor="middle" font-size="11" font-family="Courier, monospace" fill="#111">person1.__proto__</text>
  <text x="654" y="221" text-anchor="middle" font-size="11" font-family="Courier, monospace" fill="#111">=== Person.prototype</text>
  <text x="654" y="242" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#111">true</text>

  <text x="380" y="364" text-anchor="middle" font-size="12.5" fill="#333">A function owns a mould. An object remembers which mould it came from.</text>
</svg>
