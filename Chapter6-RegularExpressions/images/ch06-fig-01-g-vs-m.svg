<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 360" width="740" height="360" font-family="Helvetica, Arial, sans-serif">
  <rect width="740" height="360" fill="#ffffff"/>
  <text x="370" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#111">g and m answer two different questions</text>
  <text x="370" y="52" text-anchor="middle" font-size="12.5" fill="#333">g asks HOW MANY matches. m asks what ^ and $ MEAN.</text>

  <text x="30" y="86" font-size="12" font-weight="bold" fill="#111">The text (three lines):</text>
  <rect x="30" y="94" width="150" height="76" rx="5" fill="#f4f4f4" stroke="#111" stroke-width="1.5"/>
  <text x="42" y="115" font-size="12" font-family="Courier, monospace" fill="#111">cat sits</text>
  <text x="42" y="135" font-size="12" font-family="Courier, monospace" fill="#111">cat naps</text>
  <text x="42" y="155" font-size="12" font-family="Courier, monospace" fill="#111">cat runs</text>

  <line x1="30" y1="196" x2="710" y2="196" stroke="#ccc" stroke-width="1"/>
  <text x="30" y="220" font-size="12" font-weight="bold" fill="#111">Pattern</text>
  <text x="180" y="220" font-size="12" font-weight="bold" fill="#111">Finds</text>
  <text x="400" y="220" font-size="12" font-weight="bold" fill="#111">Why</text>

  <text x="30" y="248" font-size="12.5" font-family="Courier, monospace" fill="#111">/^cat/</text>
  <text x="180" y="248" font-size="12" font-family="Courier, monospace" fill="#111">["cat"]</text>
  <text x="400" y="248" font-size="11.5" fill="#444">^ means start of the WHOLE text; stops at one</text>

  <text x="30" y="274" font-size="12.5" font-family="Courier, monospace" fill="#111">/^cat/g</text>
  <text x="180" y="274" font-size="12" font-family="Courier, monospace" fill="#111">["cat"]</text>
  <text x="400" y="274" font-size="11.5" fill="#444">keep looking, but ^ still means the very start</text>

  <text x="30" y="300" font-size="12.5" font-family="Courier, monospace" fill="#111">/^cat/m</text>
  <text x="180" y="300" font-size="12" font-family="Courier, monospace" fill="#111">["cat"]</text>
  <text x="400" y="300" font-size="11.5" fill="#444">^ now means start of ANY line, but stops at one</text>

  <text x="30" y="326" font-size="12.5" font-family="Courier, monospace" font-weight="bold" fill="#111">/^cat/gm</text>
  <text x="180" y="326" font-size="12" font-family="Courier, monospace" font-weight="bold" fill="#111">["cat","cat","cat"]</text>
  <text x="400" y="326" font-size="11.5" fill="#444">both: every line start, and keep going</text>

  <text x="370" y="352" text-anchor="middle" font-size="12" fill="#333">Neither flag replaces the other. Most of the time you want both.</text>
</svg>
