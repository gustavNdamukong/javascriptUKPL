<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 330" width="740" height="330" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="m2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
  <rect width="740" height="330" fill="#ffffff"/>
  <text x="370" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#111">Sending a large file in chunks</text>

  <text x="24" y="66" font-size="12" font-weight="bold" fill="#111">One 200,000-byte file</text>
  <rect x="24" y="76" width="300" height="44" rx="4" fill="#eeeeee" stroke="#111" stroke-width="2"/>
  <text x="174" y="103" text-anchor="middle" font-size="12.5" fill="#111">video.mp4</text>

  <text x="24" y="152" font-size="12" font-weight="bold" fill="#111">sliced at 65,536 bytes each</text>
  <rect x="24" y="162" width="86" height="38" rx="4" fill="#ffffff" stroke="#111" stroke-width="2"/>
  <text x="67" y="186" text-anchor="middle" font-size="11" fill="#111">65,536</text>
  <rect x="116" y="162" width="86" height="38" rx="4" fill="#ffffff" stroke="#111" stroke-width="2"/>
  <text x="159" y="186" text-anchor="middle" font-size="11" fill="#111">65,536</text>
  <rect x="208" y="162" width="86" height="38" rx="4" fill="#ffffff" stroke="#111" stroke-width="2"/>
  <text x="251" y="186" text-anchor="middle" font-size="11" fill="#111">65,536</text>
  <rect x="300" y="162" width="52" height="38" rx="4" fill="#ffffff" stroke="#111" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="326" y="186" text-anchor="middle" font-size="11" fill="#111">3,392</text>
  <text x="326" y="216" text-anchor="middle" font-size="10" fill="#666">short last one</text>

  <line x1="366" y1="181" x2="418" y2="181" stroke="#222" stroke-width="2.5" marker-end="url(#m2)"/>
  <text x="392" y="170" text-anchor="middle" font-size="10.5" fill="#111">socket.send()</text>

  <rect x="426" y="150" width="290" height="62" rx="6" fill="#eeeeee" stroke="#111" stroke-width="2"/>
  <text x="571" y="175" text-anchor="middle" font-size="12.5" fill="#111">the server writes each chunk</text>
  <text x="571" y="196" text-anchor="middle" font-size="12.5" fill="#111">to the file as it arrives</text>

  <line x1="24" y1="240" x2="716" y2="240" stroke="#ccc" stroke-width="1"/>
  <text x="24" y="264" font-size="12" fill="#333">The loop: slice from offset, read it, send it, advance offset, repeat until offset reaches file.size.</text>
  <text x="24" y="288" font-size="12" fill="#333">Why bother? If the connection drops you resend one chunk, not the whole file. You can pause and</text>
  <text x="24" y="308" font-size="12" fill="#333">resume. And the server can start work on the first chunks while the rest are still on their way.</text>
</svg>
