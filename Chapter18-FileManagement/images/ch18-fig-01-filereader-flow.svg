<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 360" width="740" height="360" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="m1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
  <rect width="740" height="360" fill="#ffffff"/>
  <text x="370" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#111">Reading a file takes time, so the work happens in a callback</text>

  <rect x="24" y="70" width="150" height="60" rx="6" fill="#ffffff" stroke="#111" stroke-width="2"/>
  <text x="99" y="94" text-anchor="middle" font-size="12.5" fill="#111">visitor picks</text>
  <text x="99" y="114" text-anchor="middle" font-size="12.5" fill="#111">a file</text>

  <line x1="178" y1="100" x2="216" y2="100" stroke="#222" stroke-width="2" marker-end="url(#m1)"/>

  <rect x="222" y="70" width="180" height="60" rx="6" fill="#eeeeee" stroke="#111" stroke-width="2"/>
  <text x="312" y="95" text-anchor="middle" font-size="12.5" font-family="Courier, monospace" fill="#111">readAsText(file)</text>
  <text x="312" y="116" text-anchor="middle" font-size="11" fill="#444">starts the read, then</text>

  <line x1="406" y1="100" x2="444" y2="100" stroke="#222" stroke-width="2" marker-end="url(#m1)"/>

  <rect x="450" y="70" width="266" height="60" rx="6" fill="#ffffff" stroke="#111" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="583" y="95" text-anchor="middle" font-size="12.5" fill="#111">returns IMMEDIATELY</text>
  <text x="583" y="116" text-anchor="middle" font-size="11" fill="#444">with nothing. The file is not read yet.</text>

  <line x1="312" y1="136" x2="312" y2="186" stroke="#222" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#m1)"/>
  <text x="322" y="166" font-size="11" fill="#666">some time later...</text>

  <rect x="180" y="192" width="380" height="76" rx="6" fill="#eeeeee" stroke="#111" stroke-width="2.5"/>
  <text x="370" y="216" text-anchor="middle" font-size="12.5" font-family="Courier, monospace" fill="#111">reader.onload = function (e) { ... }</text>
  <text x="370" y="238" text-anchor="middle" font-size="11.5" fill="#444">fires when the read has finished</text>
  <text x="370" y="258" text-anchor="middle" font-size="12" font-family="Courier, monospace" fill="#111">e.target.result  ← the contents</text>

  <line x1="24" y1="292" x2="716" y2="292" stroke="#ccc" stroke-width="1"/>
  <text x="24" y="316" font-size="12" fill="#333">This is why the handler is written BEFORE the readAsText() call that triggers it. Put your code</text>
  <text x="24" y="336" font-size="12" fill="#333">on the line after readAsText() instead and it runs too early — the result is still undefined.</text>
  <text x="24" y="356" font-size="12" fill="#333">Same shape as an Image: set onload first, then set src.</text>
</svg>
