<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 380" width="740" height="380" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
  <rect width="740" height="380" fill="#ffffff"/>
  <text x="370" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#111">Stack and queue: same array, different end</text>

  <text x="30" y="66" font-size="13.5" font-weight="bold" fill="#111">STACK — Last In, First Out</text>
  <text x="30" y="84" font-size="11.5" fill="#666">a pile of plates: you take from the top</text>
  <rect x="60" y="100" width="130" height="34" rx="4" fill="#eeeeee" stroke="#111" stroke-width="2"/>
  <text x="125" y="123" text-anchor="middle" font-size="13" font-family="Courier, monospace" fill="#111">"checkout"</text>
  <rect x="60" y="134" width="130" height="34" rx="4" fill="#ffffff" stroke="#111" stroke-width="2"/>
  <text x="125" y="157" text-anchor="middle" font-size="13" font-family="Courier, monospace" fill="#111">"products"</text>
  <rect x="60" y="168" width="130" height="34" rx="4" fill="#ffffff" stroke="#111" stroke-width="2"/>
  <text x="125" y="191" text-anchor="middle" font-size="13" font-family="Courier, monospace" fill="#111">"home"</text>
  <line x1="238" y1="150" x2="204" y2="117" stroke="#222" stroke-width="2" marker-end="url(#s)"/>
  <text x="246" y="140" font-size="12" font-family="Courier, monospace" fill="#111">push()</text>
  <text x="246" y="158" font-size="12" font-family="Courier, monospace" fill="#111">pop()</text>
  <text x="246" y="176" font-size="11" fill="#666">both at the top</text>

  <line x1="370" y1="56" x2="370" y2="228" stroke="#ccc" stroke-width="1"/>

  <text x="400" y="66" font-size="13.5" font-weight="bold" fill="#111">QUEUE — First In, First Out</text>
  <text x="400" y="84" font-size="11.5" fill="#666">people at a till: first come, first served</text>
  <rect x="410" y="112" width="86" height="40" rx="4" fill="#ffffff" stroke="#111" stroke-width="2"/>
  <text x="453" y="137" text-anchor="middle" font-size="12" font-family="Courier, monospace" fill="#111">"print"</text>
  <rect x="500" y="112" width="86" height="40" rx="4" fill="#ffffff" stroke="#111" stroke-width="2"/>
  <text x="543" y="137" text-anchor="middle" font-size="12" font-family="Courier, monospace" fill="#111">"email"</text>
  <rect x="590" y="112" width="86" height="40" rx="4" fill="#eeeeee" stroke="#111" stroke-width="2"/>
  <text x="633" y="137" text-anchor="middle" font-size="12" font-family="Courier, monospace" fill="#111">"update"</text>
  <line x1="410" y1="176" x2="376" y2="176" stroke="#222" stroke-width="2" marker-end="url(#s)"/>
  <text x="400" y="192" font-size="12" font-family="Courier, monospace" fill="#111">shift()</text>
  <text x="400" y="208" font-size="11" fill="#666">out at the front</text>
  <line x1="676" y1="176" x2="700" y2="176" stroke="#222" stroke-width="2" marker-end="url(#s)"/>
  <text x="590" y="192" font-size="12" font-family="Courier, monospace" fill="#111">push()</text>
  <text x="590" y="208" font-size="11" fill="#666">in at the back</text>

  <line x1="30" y1="252" x2="710" y2="252" stroke="#ccc" stroke-width="1"/>
  <text x="30" y="278" font-size="12.5" font-weight="bold" fill="#111">In JavaScript both are just an array</text>
  <text x="30" y="304" font-size="12" font-family="Courier, monospace" fill="#111">stack.push(item);   stack.pop();</text>
  <text x="330" y="304" font-size="11.5" fill="#666">— add and remove at the same end</text>
  <text x="30" y="326" font-size="12" font-family="Courier, monospace" fill="#111">queue.push(item);   queue.shift();</text>
  <text x="330" y="326" font-size="11.5" fill="#666">— add at one end, remove from the other</text>
  <text x="370" y="360" text-anchor="middle" font-size="12.5" fill="#333">The only difference is pop() versus shift().</text>
</svg>
