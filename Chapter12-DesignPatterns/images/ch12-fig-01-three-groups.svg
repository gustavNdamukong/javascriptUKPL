<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 330" width="740" height="330" font-family="Helvetica, Arial, sans-serif">
  <rect width="740" height="330" fill="#ffffff"/>
  <text x="370" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#111">The three families of design pattern</text>
  <text x="370" y="52" text-anchor="middle" font-size="12.5" fill="#333">Birth, arrangement, conversation.</text>

  <rect x="24" y="76" width="222" height="192" rx="8" fill="#ffffff" stroke="#111" stroke-width="2"/>
  <text x="135" y="102" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#111">CREATIONAL</text>
  <text x="135" y="122" text-anchor="middle" font-size="11.5" fill="#666">how objects are MADE</text>
  <text x="135" y="152" text-anchor="middle" font-size="12" fill="#111">Singleton</text>
  <text x="135" y="172" text-anchor="middle" font-size="12" fill="#111">Factory</text>
  <text x="135" y="192" text-anchor="middle" font-size="12" fill="#111">Abstract Factory</text>
  <text x="135" y="212" text-anchor="middle" font-size="12" fill="#111">Builder</text>
  <text x="135" y="232" text-anchor="middle" font-size="12" fill="#111">Prototype</text>

  <rect x="258" y="76" width="222" height="192" rx="8" fill="#f4f4f4" stroke="#111" stroke-width="2"/>
  <text x="369" y="102" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#111">STRUCTURAL</text>
  <text x="369" y="122" text-anchor="middle" font-size="11.5" fill="#666">how they are ARRANGED</text>
  <text x="369" y="152" text-anchor="middle" font-size="12" fill="#111">Adapter</text>
  <text x="369" y="172" text-anchor="middle" font-size="12" fill="#111">Decorator</text>
  <text x="369" y="192" text-anchor="middle" font-size="12" fill="#111">Facade</text>
  <text x="369" y="212" text-anchor="middle" font-size="12" fill="#111">Composite</text>
  <text x="369" y="232" text-anchor="middle" font-size="12" fill="#111">Proxy, Bridge, Flyweight</text>

  <rect x="492" y="76" width="222" height="192" rx="8" fill="#ffffff" stroke="#111" stroke-width="2"/>
  <text x="603" y="102" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#111">BEHAVIOURAL</text>
  <text x="603" y="122" text-anchor="middle" font-size="11.5" fill="#666">how they TALK to each other</text>
  <text x="603" y="152" text-anchor="middle" font-size="12" fill="#111">Observer</text>
  <text x="603" y="172" text-anchor="middle" font-size="12" fill="#111">Strategy</text>
  <text x="603" y="192" text-anchor="middle" font-size="12" fill="#111">Template Method</text>
  <text x="603" y="212" text-anchor="middle" font-size="12" fill="#111">Command</text>
  <text x="603" y="232" text-anchor="middle" font-size="12" fill="#111">Iterator</text>

  <text x="370" y="298" text-anchor="middle" font-size="12.5" fill="#333">You already use one of these without knowing its name: addEventListener</text>
  <text x="370" y="316" text-anchor="middle" font-size="12.5" fill="#333">is the Observer pattern.</text>
</svg>
