<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 330" width="740" height="330" font-family="Helvetica, Arial, sans-serif">
  <rect width="740" height="330" fill="#ffffff"/>
  <text x="370" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#111">Why the pixel loop counts in fours</text>
  <text x="370" y="52" text-anchor="middle" font-size="12.5" fill="#333">imageData.data is one long flat list — four numbers per pixel.</text>
  <g font-family="Courier, monospace" font-size="12">
    <rect x="40" y="80" width="46" height="34" fill="#dddddd" stroke="#111" stroke-width="1.5"/><text x="63" y="103" text-anchor="middle">R</text>
    <rect x="86" y="80" width="46" height="34" fill="#dddddd" stroke="#111" stroke-width="1.5"/><text x="109" y="103" text-anchor="middle">G</text>
    <rect x="132" y="80" width="46" height="34" fill="#dddddd" stroke="#111" stroke-width="1.5"/><text x="155" y="103" text-anchor="middle">B</text>
    <rect x="178" y="80" width="46" height="34" fill="#ffffff" stroke="#111" stroke-width="1.5" stroke-dasharray="4 3"/><text x="201" y="103" text-anchor="middle">A</text>
    <rect x="234" y="80" width="46" height="34" fill="#dddddd" stroke="#111" stroke-width="1.5"/><text x="257" y="103" text-anchor="middle">R</text>
    <rect x="280" y="80" width="46" height="34" fill="#dddddd" stroke="#111" stroke-width="1.5"/><text x="303" y="103" text-anchor="middle">G</text>
    <rect x="326" y="80" width="46" height="34" fill="#dddddd" stroke="#111" stroke-width="1.5"/><text x="349" y="103" text-anchor="middle">B</text>
    <rect x="372" y="80" width="46" height="34" fill="#ffffff" stroke="#111" stroke-width="1.5" stroke-dasharray="4 3"/><text x="395" y="103" text-anchor="middle">A</text>
    <rect x="428" y="80" width="46" height="34" fill="#dddddd" stroke="#111" stroke-width="1.5"/><text x="451" y="103" text-anchor="middle">R</text>
    <rect x="474" y="80" width="46" height="34" fill="#dddddd" stroke="#111" stroke-width="1.5"/><text x="497" y="103" text-anchor="middle">G</text>
    <rect x="520" y="80" width="46" height="34" fill="#dddddd" stroke="#111" stroke-width="1.5"/><text x="543" y="103" text-anchor="middle">B</text>
    <rect x="566" y="80" width="46" height="34" fill="#ffffff" stroke="#111" stroke-width="1.5" stroke-dasharray="4 3"/><text x="589" y="103" text-anchor="middle">A</text>
    <text x="632" y="104" font-size="15">...</text>
  </g>
  <text x="63" y="132" text-anchor="middle" font-size="10.5" fill="#666">[0]</text>
  <text x="201" y="132" text-anchor="middle" font-size="10.5" fill="#666">[3]</text>
  <text x="257" y="132" text-anchor="middle" font-size="10.5" fill="#666">[4]</text>
  <text x="451" y="132" text-anchor="middle" font-size="10.5" fill="#666">[8]</text>
  <line x1="40" y1="148" x2="224" y2="148" stroke="#111" stroke-width="1.5"/>
  <text x="132" y="166" text-anchor="middle" font-size="11.5" fill="#111">pixel 1</text>
  <line x1="234" y1="148" x2="418" y2="148" stroke="#111" stroke-width="1.5"/>
  <text x="326" y="166" text-anchor="middle" font-size="11.5" fill="#111">pixel 2</text>
  <line x1="428" y1="148" x2="612" y2="148" stroke="#111" stroke-width="1.5"/>
  <text x="520" y="166" text-anchor="middle" font-size="11.5" fill="#111">pixel 3</text>
  <line x1="40" y1="190" x2="700" y2="190" stroke="#ccc" stroke-width="1"/>
  <text x="40" y="216" font-size="12" font-family="Courier, monospace" fill="#111">for (let i = 0; i &lt; data.length; i += 4) {</text>
  <text x="76" y="236" font-size="12" font-family="Courier, monospace" fill="#111">const avg = (data[i] + data[i+1] + data[i+2]) / 3;</text>
  <text x="76" y="256" font-size="12" font-family="Courier, monospace" fill="#111">data[i] = data[i+1] = data[i+2] = avg;</text>
  <text x="40" y="276" font-size="12" font-family="Courier, monospace" fill="#111">}</text>
  <text x="40" y="304" font-size="12" fill="#333">i += 4 steps one whole pixel at a time. data[i+3] — the dashed A boxes — is never written,</text>
  <text x="40" y="322" font-size="12" fill="#333">because alpha is transparency, not colour. Average it in and the image would fade as well as grey.</text>
</svg>
