<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 340" width="740" height="340" font-family="Helvetica, Arial, sans-serif">
  <rect width="740" height="340" fill="#ffffff"/>
  <text x="370" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#111">Live HTMLCollection vs static NodeList</text>
  <text x="370" y="52" text-anchor="middle" font-size="12.5" fill="#333">Both are taken when the page has two matching paragraphs. Then a third is added.</text>

  <rect x="24" y="76" width="330" height="140" rx="8" fill="#ffffff" stroke="#111" stroke-width="2"/>
  <text x="189" y="100" text-anchor="middle" font-size="13" font-weight="bold" fill="#111">HTMLCollection — LIVE</text>
  <text x="189" y="122" text-anchor="middle" font-size="11.5" font-family="Courier, monospace" fill="#111">getElementsByClassName("t")</text>
  <text x="60" y="152" font-size="12" fill="#333">before:</text>
  <text x="200" y="152" font-size="13" font-family="Courier, monospace" fill="#111">.length  2</text>
  <text x="60" y="180" font-size="12" fill="#333">after adding a third:</text>
  <text x="200" y="180" font-size="13" font-family="Courier, monospace" font-weight="bold" fill="#111">.length  3</text>
  <text x="189" y="204" text-anchor="middle" font-size="11" fill="#666">it noticed, on its own</text>

  <rect x="386" y="76" width="330" height="140" rx="8" fill="#f4f4f4" stroke="#111" stroke-width="2"/>
  <text x="551" y="100" text-anchor="middle" font-size="13" font-weight="bold" fill="#111">NodeList — STATIC</text>
  <text x="551" y="122" text-anchor="middle" font-size="11.5" font-family="Courier, monospace" fill="#111">querySelectorAll(".t")</text>
  <text x="422" y="152" font-size="12" fill="#333">before:</text>
  <text x="562" y="152" font-size="13" font-family="Courier, monospace" fill="#111">.length  2</text>
  <text x="422" y="180" font-size="12" fill="#333">after adding a third:</text>
  <text x="562" y="180" font-size="13" font-family="Courier, monospace" font-weight="bold" fill="#111">.length  2</text>
  <text x="551" y="204" text-anchor="middle" font-size="11" fill="#666">a snapshot; it never changes</text>

  <line x1="24" y1="244" x2="716" y2="244" stroke="#ccc" stroke-width="1"/>
  <text x="24" y="268" font-size="12.5" font-weight="bold" fill="#111">And what you can do with each</text>
  <text x="34" y="292" font-size="12" font-family="Courier, monospace" fill="#111">for...of</text>
  <text x="200" y="292" font-size="12" fill="#111">both — yes</text>
  <text x="34" y="312" font-size="12" font-family="Courier, monospace" fill="#111">.forEach()</text>
  <text x="200" y="312" font-size="12" fill="#111">NodeList only</text>
  <text x="34" y="332" font-size="12" font-family="Courier, monospace" fill="#111">.map() .filter()</text>
  <text x="200" y="332" font-size="12" fill="#111">neither — convert first with [...collection]</text>
</svg>
