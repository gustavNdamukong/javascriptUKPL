<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 330" width="740" height="330" font-family="Helvetica, Arial, sans-serif">
  <rect width="740" height="330" fill="#ffffff"/>
  <text x="370" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#111">The eight falsy values — and everything else</text>

  <rect x="30" y="56" width="330" height="200" rx="8" fill="#eeeeee" stroke="#111" stroke-width="2"/>
  <text x="195" y="82" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#111">FALSY — all eight of them</text>
  <text x="195" y="112" text-anchor="middle" font-size="15" font-family="Courier, monospace" fill="#111">false      0      -0</text>
  <text x="195" y="140" text-anchor="middle" font-size="15" font-family="Courier, monospace" fill="#111">0n      ""      null</text>
  <text x="195" y="168" text-anchor="middle" font-size="15" font-family="Courier, monospace" fill="#111">undefined      NaN</text>
  <text x="195" y="204" text-anchor="middle" font-size="11.5" fill="#444">Learn this list. It is short and it is closed —</text>
  <text x="195" y="222" text-anchor="middle" font-size="11.5" fill="#444">nothing else in the language is falsy.</text>

  <rect x="386" y="56" width="324" height="200" rx="8" fill="#ffffff" stroke="#111" stroke-width="2"/>
  <text x="548" y="82" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#111">TRUTHY — literally everything else</text>
  <text x="548" y="112" text-anchor="middle" font-size="11.5" fill="#444">including the four that catch people out:</text>
  <text x="548" y="142" text-anchor="middle" font-size="15" font-family="Courier, monospace" fill="#111">[]        {}</text>
  <text x="548" y="170" text-anchor="middle" font-size="15" font-family="Courier, monospace" fill="#111">"0"     "false"</text>
  <text x="548" y="206" text-anchor="middle" font-size="11.5" fill="#444">An empty array and an empty object are</text>
  <text x="548" y="224" text-anchor="middle" font-size="11.5" fill="#444">TRUTHY. In PHP they would not be.</text>

  <text x="30" y="286" font-size="12" fill="#333">So to ask "does this array have anything in it?", never write</text>
  <text x="30" y="306" font-size="12" font-family="Courier, monospace" fill="#111">if (myArray)</text>
  <text x="150" y="306" font-size="12" fill="#333">— that is always true. Ask</text>
  <text x="330" y="306" font-size="12" font-family="Courier, monospace" fill="#111">if (myArray.length > 0)</text>
  <text x="546" y="306" font-size="12" fill="#333">instead.</text>
</svg>
