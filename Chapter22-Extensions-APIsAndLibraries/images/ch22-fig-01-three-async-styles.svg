<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 400" width="740" height="400" font-family="Helvetica, Arial, sans-serif">
  <rect width="740" height="400" fill="#ffffff"/>
  <text x="370" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#111">The same wait, written three ways</text>
  <text x="370" y="52" text-anchor="middle" font-size="12.5" fill="#333">All three do exactly the same thing. Each generation made the previous one easier to read.</text>

  <rect x="24" y="76" width="692" height="88" rx="6" fill="#ffffff" stroke="#111" stroke-width="2"/>
  <text x="40" y="98" font-size="12.5" font-weight="bold" fill="#111">1. CALLBACK — pass a function to be called when it is done</text>
  <text x="40" y="122" font-size="11.5" font-family="Courier, monospace" fill="#111">createPost(post, getPosts);</text>
  <text x="40" y="150" font-size="11" fill="#666">Works, but nest a few of these and you get the "pyramid" that made promises necessary.</text>

  <rect x="24" y="176" width="692" height="100" rx="6" fill="#f4f4f4" stroke="#111" stroke-width="2"/>
  <text x="40" y="198" font-size="12.5" font-weight="bold" fill="#111">2. PROMISE — .then() for success, .catch() for failure</text>
  <text x="40" y="222" font-size="11.5" font-family="Courier, monospace" fill="#111">fetch(url)</text>
  <text x="40" y="240" font-size="11.5" font-family="Courier, monospace" fill="#111">    .then(response =&gt; response.json())</text>
  <text x="40" y="258" font-size="11.5" font-family="Courier, monospace" fill="#111">    .catch(error =&gt; console.error(error));</text>

  <rect x="24" y="288" width="692" height="112" rx="6" fill="#ffffff" stroke="#111" stroke-width="2.5"/>
  <text x="40" y="310" font-size="12.5" font-weight="bold" fill="#111">3. ASYNC / AWAIT — the same promise, read top to bottom</text>
  <text x="40" y="334" font-size="11.5" font-family="Courier, monospace" fill="#111">try {</text>
  <text x="40" y="352" font-size="11.5" font-family="Courier, monospace" fill="#111">    const response = await fetch(url);</text>
  <text x="40" y="370" font-size="11.5" font-family="Courier, monospace" fill="#111">    const data = await response.json();</text>
  <text x="40" y="388" font-size="11.5" font-family="Courier, monospace" fill="#111">} catch (error) { console.error(error); }</text>
</svg>
